<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4 text-center" style="width: 420px;">

        <h1 class="display-4">Упс!</h1>
        <p class="lead">Что-то пошло не так</p>

        <p class="text-muted">
            Код ошибки: <span th:text="${status}">500</span>
        </p>

        <p class="text-muted">
            <span th:text="${error}">Internal Server Error</span>
        </p>

        <a href="/" class="btn btn-primary mt-3">На главную</a>
    </div>
</div>

</body>
</html>
